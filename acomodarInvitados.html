<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación de Mesas desde Cero</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
            color: #333;
        }

        /* --- PANEL DE INVITADOS --- */
        #panel-invitados {
            width: 320px;
            background-color: #ffffff;
            border-right: 1px solid #dcdfe6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }

        #panel-invitados h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .subtitulo {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        .lista-scroll {
            overflow-y: auto;
            flex-grow: 1;
            border: 2px dashed #dcdfe6;
            padding: 10px;
            background-color: #fbfbfc;
            border-radius: 8px;
        }

        .invitado {
            background-color: #eef5fe;
            border: 1px solid #b3d8ff;
            color: #409eff;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: grab;
            user-select: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: transform 0.1s, background-color 0.2s;
        }

        .invitado:hover {
            background-color: #ecf5ff;
        }

        .invitado:active {
            cursor: grabbing;
            transform: scale(0.98);
        }

        /* --- CONTENEDOR DE MESAS --- */
        #distribucion-mesas {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            background-color: #f4f6f9;
        }

        /* --- DISEÑO DE CADA MESA --- */
        .mesa-cuadrada {
            background-color: #ffffff;
            border: 1px solid #e4e7ed;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .mesa-titulo {
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: #303133;
            padding-bottom: 6px;
            border-bottom: 2px solid #f2f6fc;
        }

        .asientos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .asiento {
            background-color: #f5f7fa;
            border: 1px dashed #dcdfe6;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #909399;
            overflow: hidden;
            transition: all 0.2s;
        }

        .asiento.ocupado {
            border-style: solid;
            background-color: #f0f9eb;
            border-color: #c2e7b0;
            color: #67c23a;
        }

        .asiento.ocupado .invitado {
            background-color: transparent;
            border: none;
            color: #67c23a;
            padding: 0;
            margin: 0;
            width: 100%;
            text-align: center;
            font-size: 0.75rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- BOTÓN DE REINICIO --- */
        #btn-reiniciar {
            margin-top: 10px;
            background-color: #f56c6c;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        #btn-reiniciar:hover {
            background-color: #e6a23c;
        }
    </style>
</head>
<body>

    <div id="panel-invitados">
        <h2>Por Acomodar (<span id="contador">0</span>)</h2>
        <div class="subtitulo">Arrastra los nombres hacia los asientos o de vuelta aquí</div>
        <div class="lista-scroll" id="lista-origen" ondragover="allowDrop(event)" ondrop="dropBack(event)">
            </div>
        <button id="btn-reiniciar" onclick="reiniciarTodo()">Reiniciar Distribución</button>
    </div>

    <div id="distribucion-mesas">
        </div>

    <script>
        // Lista única unificada sin etiquetas de mesa
        const listaInvitadosUnica = [
            "Donaldo", "Martha", "Jesús", "Griselda", "Cristopher", "Desari", "Lucian", "Armando", "Doan", "Kareem",
            "Illi", "Jooy", "Julián", "José", "Irma", "Carlos", "Irma", "Carla", "Martines A. Sharim",
            "Nestor", "Elizabeth", "Hannia", "Alice", "Niels", "Silvia", "Melanie", "Lilith", "Elena",
            "David", "Asela", "Roberthor", "Fernando", "Brenda", "Tania Fernanda",
            "Ángel", "Eugenia", "Hayde", "Zayra", "Armando Alberto", "Leonardo", "Tadeo bb", "Guadalupe", "Angeles", "Natalia", "Pedro",
            "Roman", "Elvira", "Ángel", "Logan", "Matias", "Romina", "Hayde", "Jorge", "Emilio", "Valentina",
            "J. Consepcion", "Elena", "Brandon", "Brenda", "Marisol", "Andres", "Camila Monserrat", "Liam Santiago", "Hugo", "Marce", "Sofía",
            "Edgardo", "Elvia", "Joan", "Enrique", "Silvia",
            "Roberto", "Griselda", "Renata", "Isai", "Carla", "Adelina", "Juan Carlos", "Ariana", "Ximena", "Isaac", "Emilio [bb]",
            "Rocio", "Angeles", "Rocio h.", "Norberto", "Josue", "Carlos", "Jesús", "Carolina", "Jazmín", "Samuel", "Monserrat", "+1 pase",
            "Ángel", "Paula", "Alison", "Santiago", "Margarita", "Ricardo", "Arelí", "Samantha", "Johan", "Andrik",
            "Víctor", "Verónica", "Cristian", "Estefania", "Sebastián", "Alberto", "Marisela", "Angelica", "+1 pase", "Diego", "+1 pase", "+1 pase [niño]",
            "César", "Luz", "Giovani", "Nayeli", "José Alfredo", "+1 pase", "Fernando", "Elizabeth Ketzalzin", "+1 pase",
            "Enrique", "Misael", "Liliana", "Zelzin", "Mitzi", "Alexis",
            "José Eduardo", "+1 pase", "Donaldo", "Victoria", "Lyan [niño]", "Alejandro", "+1 pase", "Erik",
            "Adelina", "Roberto", "Omar", "Alejandra", "Mariana", "Omar h.", "Rubén", "Marcos"
        ];

        const listaOrigen = document.getElementById('lista-origen');
        const contenedorMesas = document.getElementById('distribucion-mesas');

        // 1. Crear la estructura de las 16 mesas fijas
        for (let i = 1; i <= 16; i++) {
            let mesaHtml = `
                <div class="mesa-cuadrada">
                    <div class="mesa-titulo">Mesa ${i}</div>
                    <div class="asientos-grid">
            `;
            for (let j = 1; j <= 12; j++) {
                mesaHtml += `<div class="asiento" id="m${i}-asiento${j}" ondragover="allowDrop(event)" ondrop="drop(event)">${j}</div>`;
            }
            mesaHtml += `</div></div>`;
            contenedorMesas.innerHTML += mesaHtml;
        }

        // 2. Inicializar la aplicación
        function inicializar() {
            const mapaGuardado = localStorage.getItem('distribucionBodas');
            
            if (mapaGuardado) {
                cargarProgreso(JSON.parse(mapaGuardado));
            } else {
                // Población limpia y directa sin textos de grupos parentesis
                listaInvitadosUnica.forEach((nombre, index) => {
                    crearElementoInvitado(`inv-${index + 1}`, nombre, listaOrigen);
                });
            }
            actualizarContador();
        }

        function crearElementoInvitado(id, texto, contenedorPadre) {
            const div = document.createElement('div');
            div.className = 'invitado';
            div.id = id;
            div.draggable = true;
            div.innerText = texto;
            div.ondragstart = drag;
            contenedorPadre.appendChild(div);
        }

        // 3. Funciones de guardado y carga automática
        function guardarProgreso() {
            const estadoActual = {
                listaIzquierda: [],
                asientos: {}
            };

            Array.from(listaOrigen.children).forEach(nodo => {
                estadoActual.listaIzquierda.push({ id: nodo.id, texto: nodo.innerText });
            });

            document.querySelectorAll('.asiento').forEach(asiento => {
                if (asiento.classList.contains('ocupado')) {
                    const nodoInvitado = asiento.querySelector('.invitado');
                    estadoActual.asientos[asiento.id] = {
                        id: nodoInvitado.id,
                        texto: nodoInvitado.innerText
                    };
                }
            });

            localStorage.setItem('distribucionBodas', JSON.stringify(estadoActual));
        }

        function cargarProgreso(estado) {
            estado.listaIzquierda.forEach(item => {
                crearElementoInvitado(item.id, item.texto, listaOrigen);
            });

            Object.keys(estado.asientos).forEach(asientoId => {
                const asientoEsl = document.getElementById(asientoId);
                if (asientoEsl) {
                    asientoEsl.innerHTML = "";
                    const datosInv = estado.asientos[asientoId];
                    crearElementoInvitado(datosInv.id, datosInv.texto, asientoEsl);
                    asientoEsl.classList.add('ocupado');
                }
            });
        }

        function reiniciarTodo() {
            if (confirm("¿Estás seguro de que quieres restablecer todas las mesas? Se perderá el orden actual.")) {
                localStorage.removeItem('distribucionBodas');
                location.reload();
            }
        }

        // 4. Lógica de Drag & Drop
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const invitadoNode = document.getElementById(data);
            
            let destino = ev.target;
            if (destino.classList.contains("invitado")) { destino = destino.parentNode; }

            if (destino.classList.contains("asiento") && !destino.classList.contains("ocupado")) {
                const padreAnterior = invitadoNode.parentNode;
                if (padreAnterior.classList.contains("asiento")) {
                    padreAnterior.classList.remove("ocupado");
                    padreAnterior.innerText = padreAnterior.id.split('asiento')[1];
                }

                destino.innerHTML = "";
                destino.appendChild(invitadoNode);
                destino.classList.add("ocupado");
                
                actualizarContador();
                guardarProgreso();
            }
        }

        function dropBack(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const invitadoNode = document.getElementById(data);
            
            const padreAnterior = invitadoNode.parentNode;
            if (padreAnterior.classList.contains("asiento")) {
                padreAnterior.classList.remove("ocupado");
                padreAnterior.innerText = padreAnterior.id.split('asiento')[1];
            }

            listaOrigen.appendChild(invitadoNode);
            actualizarContador();
            guardarProgreso();
        }

        function actualizarContador() {
            document.getElementById("contador").innerText = listaOrigen.children.length;
        }

        inicializar();
    </script>
</body>
</html>
