<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación de Mesas Multidispositivo con Confirmación</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
            color: #333;
        }

        /* --- PANEL DE INVITADOS --- */
        #panel-invitados {
            width: 320px;
            background-color: #ffffff;
            border-right: 1px solid #dcdfe6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }

        #panel-invitados h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .subtitulo {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        .lista-scroll {
            overflow-y: auto;
            flex-grow: 1;
            border: 2px dashed #dcdfe6;
            padding: 10px;
            background-color: #fbfbfc;
            border-radius: 8px;
        }

        .invitado {
            background-color: #eef5fe;
            border: 1px solid #b3d8ff;
            color: #409eff;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: grab;
            user-select: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s, background-color 0.2s;
        }

        .invitado:hover { background-color: #ecf5ff; }
        .invitado:active { cursor: grabbing; transform: scale(0.98); }

        /* Estilo especial cuando el invitado está confirmado */
        .invitado.confirmado {
            background-color: #fff7e6;
            border-color: #ffd591;
            color: #d46b08;
        }

        .estrella {
            font-size: 1rem;
            color: #ffc107;
            visibility: hidden;
        }

        .invitado.confirmado .estrella {
            visibility: visible;
        }

        /* --- CONTENEDOR DE MESAS --- */
        #distribucion-mesas {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            background-color: #f4f6f9;
        }

        /* --- DISEÑO DE MESA Y ASIENTOS --- */
        .mesa-cuadrada {
            background-color: #ffffff;
            border: 1px solid #e4e7ed;
            border-radius: 10px;
            padding: 12px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .mesa-titulo {
            text-align: center;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: #303133;
            padding-bottom: 6px;
            border-bottom: 2px solid #f2f6fc;
        }

        .asientos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .asiento {
            background-color: #f5f7fa;
            border: 1px dashed #dcdfe6;
            height: 36px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #909399;
            overflow: hidden;
            transition: all 0.2s;
        }

        .asiento.ocupado {
            border-style: solid;
            background-color: #f0f9eb;
            border-color: #c2e7b0;
            color: #67c23a;
        }

        /* Ajustes para el invitado dentro de un asiento de mesa */
        .asiento.ocupado .invitado {
            background-color: transparent;
            border: none;
            padding: 0 4px;
            margin: 0;
            width: 100%;
            height: 100%;
        }

        .asiento.ocupado .invitado.confirmado {
            color: #d46b08;
        }

        .nombre-texto {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            text-align: center;
        }

        /* --- SECCIÓN DE BOTONES --- */
        .panel-botones {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            width: 100%;
        }

        .btn-success { background-color: #67c23a; color: white; }
        .btn-success:hover { background-color: #5daf34; }

        .btn-info { background-color: #409eff; color: white; }
        .btn-info:hover { background-color: #66b1ff; }

        .btn-danger { background-color: #f56c6c; color: white; }
        .btn-danger:hover { background-color: #f78989; }

        #input-archivo { display: none; }
    </style>
</head>
<body>

    <div id="panel-invitados">
        <h2>Por Acomodar (<span id="contador">0</span>)</h2>
        <div class="subtitulo">💡 <b>Tip:</b> Da doble clic sobre un invitado para marcarlo/desmarcarlo con estrella ⭐.</div>
        
        <div class="lista-scroll" id="lista-origen" ondragover="allowDrop(event)" ondrop="dropBack(event)">
            </div>

        <div class="panel-botones">
            <button class="btn btn-success" onclick="exportarDisposicion()">📤 Guardar / Exportar Archivo</button>
            
            <label class="btn btn-info" for="input-archivo">
                📥 Importar desde Archivo
            </label>
            <input type="file" id="input-archivo" accept=".json" onchange="importarDisposicion(event)">
            
            <button class="btn btn-danger" onclick="reiniciarTodo()">❌ Reiniciar Todo</button>
        </div>
    </div>

    <div id="distribucion-mesas">
        </div>

    <script>
        const listaInvitadosUnica = [
            "Donaldo", "Martha", "Jesús", "Griselda", "Cristopher", "Desari", "Lucian", "Armando", "Doan", "Kareem",
            "Illi", "Jooy", "Julián", "José", "Irma", "Carlos", "Irma", "Carla", "Martines A. Sharim",
            "Nestor", "Elizabeth", "Hannia", "Alice", "Niels", "Silvia", "Melanie", "Lilith", "Elena",
            "David", "Asela", "Roberthor", "Fernando", "Brenda", "Tania Fernanda",
            "Ángel", "Eugenia", "Hayde", "Zayra", "Armando Alberto", "Leonardo", "Tadeo bb", "Guadalupe", "Angeles", "Natalia", "Pedro",
            "Roman", "Elvira", "Ángel", "Logan", "Matias", "Romina", "Hayde", "Jorge", "Emilio", "Valentina",
            "J. Consepcion", "Elena", "Brandon", "Brenda", "Marisol", "Andres", "Camila Monserrat", "Liam Santiago", "Hugo", "Marce", "Sofía",
            "Edgardo", "Elvia", "Joan", "Enrique", "Silvia",
            "Roberto", "Griselda", "Renata", "Isai", "Carla", "Adelina", "Juan Carlos", "Ariana", "Ximena", "Isaac", "Emilio [bb]",
            "Rocio", "Angeles", "Rocio h.", "Norberto", "Josue", "Carlos", "Jesús", "Carolina", "Jazmín", "Samuel", "Monserrat", "+1 pase",
            "Ángel", "Paula", "Alison", "Santiago", "Margarita", "Ricardo", "Arelí", "Samantha", "Johan", "Andrik",
            "Víctor", "Verónica", "Cristian", "Estefania", "Sebastián", "Alberto", "Marisela", "Angelica", "+1 pase", "Diego", "+1 pase", "+1 pase [niño]",
            "César", "Luz", "Giovani", "Nayeli", "José Alfredo", "+1 pase", "Fernando", "Elizabeth Ketzalzin", "+1 pase",
            "Enrique", "Misael", "Liliana", "Zelzin", "Mitzi", "Alexis",
            "José Eduardo", "+1 pase", "Donaldo", "Victoria", "Lyan [niño]", "Alejandro", "+1 pase", "Erik",
            "Adelina", "Roberto", "Omar", "Alejandra", "Mariana", "Omar h.", "Rubén", "Marcos"
        ];

        const listaOrigen = document.getElementById('lista-origen');
        const contenedorMesas = document.getElementById('distribucion-mesas');

        // Generar las 16 mesas
        for (let i = 1; i <= 16; i++) {
            let mesaHtml = `<div class="mesa-cuadrada"><div class="mesa-titulo">Mesa ${i}</div><div class="asientos-grid">`;
            for (let j = 1; j <= 12; j++) {
                mesaHtml += `<div class="asiento" id="m${i}-asiento${j}" ondragover="allowDrop(event)" ondrop="drop(event)">${j}</div>`;
            }
            mesaHtml += `</div></div>`;
            contenedorMesas.innerHTML += mesaHtml;
        }

        function inicializar() {
            const mapaGuardado = localStorage.getItem('distribucionBodas');
            if (mapaGuardado) {
                cargarProgreso(JSON.parse(mapaGuardado));
            } else {
                listaInvitadosUnica.forEach((nombre, index) => {
                    crearElementoInvitado(`inv-${index + 1}`, nombre, false, listaOrigen);
                });
            }
            actualizarContador();
        }

        function crearElementoInvitado(id, texto, confirmado, contenedorPadre) {
            const div = document.createElement('div');
            div.className = 'invitado' + (confirmado ? ' confirmado' : '');
            div.id = id;
            div.draggable = true;
            div.ondragstart = drag;
            
            // Alternar estado con doble clic
            div.ondblclick = function(e) {
                e.stopPropagation();
                this.classList.toggle('confirmado');
                guardarProgreso();
            };

            // Contenedores internos para dar soporte visual a la estrella sin romper el drag text
            const spanTexto = document.createElement('span');
            spanTexto.className = 'nombre-texto';
            spanTexto.innerText = texto;

            const spanEstrella = document.createElement('span');
            spanEstrella.className = 'estrella';
            spanEstrella.innerText = '⭐';

            div.appendChild(spanTexto);
            div.appendChild(spanEstrella);
            contenedorPadre.appendChild(div);
        }

        function obtenerEstadoActual() {
            const estado = { listaIzquierda: [], asientos: {} };
            
            Array.from(listaOrigen.children).forEach(nodo => {
                const texto = nodo.querySelector('.nombre-texto').innerText;
                const conf = nodo.classList.contains('confirmado');
                estado.listaIzquierda.push({ id: nodo.id, texto: texto, confirmado: conf });
            });
            
            document.querySelectorAll('.asiento').forEach(asiento => {
                if (asiento.classList.contains('ocupado')) {
                    const nodoInvitado = asiento.querySelector('.invitado');
                    const texto = nodoInvitado.querySelector('.nombre-texto').innerText;
                    const conf = nodoInvitado.classList.contains('confirmado');
                    estado.asientos[asiento.id] = { id: nodoInvitado.id, texto: texto, confirmado: conf };
                }
            });
            return estado;
        }

        function guardarProgreso() {
            const estado = obtenerEstadoActual();
            localStorage.setItem('distribucionBodas', JSON.stringify(estado));
        }

        function cargarProgreso(estado) {
            listaOrigen.innerHTML = "";
            document.querySelectorAll('.asiento').forEach(asiento => {
                asiento.classList.remove('ocupado');
                asiento.innerText = asiento.id.split('asiento')[1];
            });

            estado.listaIzquierda.forEach(item => {
                crearElementoInvitado(item.id, item.texto, item.confirmado, listaOrigen);
            });

            Object.keys(estado.asientos).forEach(asientoId => {
                const asientoEsl = document.getElementById(asientoId);
                if (asientoEsl) {
                    asientoEsl.innerHTML = "";
                    const datosInv = estado.asientos[asientoId];
                    crearElementoInvitado(datosInv.id, datosInv.texto, datosInv.confirmado, asientoEsl);
                    asientoEsl.classList.add('ocupado');
                }
            });
            actualizarContador();
        }

        function exportarDisposicion() {
            const estado = obtenerEstadoActual();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(estado));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "distribucion_mesas_boda.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importarDisposicion(event) {
            const archivo = event.target.files[0];
            if (!archivo) return;

            const lector = new FileReader();
            lector.onload = function(e) {
                try {
                    const estadoImportado = JSON.parse(e.target.result);
                    cargarProgreso(estadoImportado);
                    guardarProgreso();
                    alert("¡Distribución y confirmaciones cargadas exitosamente!");
                } catch (error) {
                    alert("Error: El archivo seleccionado no es válido.");
                }
            };
            lector.readAsText(archivo);
            event.target.value = '';
        }

        function reiniciarTodo() {
            if (confirm("¿Estás seguro de que deseas reiniciar? Se borrará el progreso de este dispositivo.")) {
                localStorage.removeItem('distribucionBodas');
                location.reload();
            }
        }

        // Lógica de Drag & Drop heredada
        function allowDrop(ev) { ev.preventDefault(); }
        function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const invitadoNode = document.getElementById(data);
            let destino = ev.target;
            
            if (destino.classList.contains("nombre-texto") || destino.classList.contains("estrella")) {
                destino = destino.parentNode.parentNode;
            } else if (destino.classList.contains("invitado")) {
                destino = destino.parentNode;
            }

            if (destino.classList.contains("asiento") && !destino.classList.contains("ocupado")) {
                const padreAnterior = invitadoNode.parentNode;
                if (padreAnterior.classList.contains("asiento")) {
                    padreAnterior.classList.remove("ocupado");
                    padreAnterior.innerText = padreAnterior.id.split('asiento')[1];
                }
                destino.innerHTML = "";
                destino.appendChild(invitadoNode);
                destino.classList.add("ocupado");
                actualizarContador();
                guardarProgreso();
            }
        }

        function dropBack(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const invitadoNode = document.getElementById(data);
            const padreAnterior = invitadoNode.parentNode;
            if (padreAnterior.classList.contains("asiento")) {
                padreAnterior.classList.remove("ocupado");
                padreAnterior.innerText = padreAnterior.id.split('asiento')[1];
            }
            listaOrigen.appendChild(invitadoNode);
            actualizarContador();
            guardarProgreso();
        }

        function actualizarContador() {
            document.getElementById("contador").innerText = listaOrigen.children.length;
        }

        inicializar();
    </script>
</body>
</html>
