<script>
    // URL exacta de tu Google Apps Script
    const URL_WEBHOOK_GOOGLE = "https://script.google.com/macros/s/AKfycbyJLHHcp-7CQVAgV8AyC7vpv9BfBZgkNFhRja057CWqZQS0-cZuragWdcI1tjxH2_UB1A/exec";
    
    let familiaUrlDecodificada = "";

    // 1. LEER EL APELLIDO DESDE LA URL AL ABRIR LA PÁGINA (OPTIMIZADO)
    window.onload = function() {
        const parametros = new URLSearchParams(window.location.search);
        const familiaUrl = parametros.get('familia'); 

        if (!familiaUrl) {
            mostrarEstado("error", "❌ QR Inválido<br><span style='font-size:0.9rem; font-weight:normal;'>Este código no contiene parámetros de familia.</span>");
            return;
        }

        // CORREGIDO: Convertimos "espinosa-rodriguez" de vuelta a "espinosa rodriguez" quitando los guiones
        familiaUrlDecodificada = familiaUrl.replace(/-/g, " ").toLowerCase().trim();

        // CORREGIDO: Buscamos si existe en tu archivo invitados.js
        if (!baseInvitadosEstricta[familiaUrlDecodificada]) {
            mostrarEstado("error", `❌ Familia No Encontrada<br><span style='font-size:0.9rem; font-weight:normal;'>"${familiaUrlDecodificada.toUpperCase()}" no está en la lista de invitados locales.</span>`);
            return;
        }

        // CORREGIDO: Mostramos el nombre estético en el panel
        document.getElementById("info-familia").innerText = nombresVisualesFamilias[familiaUrlDecodificada];
        document.getElementById("info-panel").style.display = "block";

        // CORREGIDO: Consultamos en Google Sheets si ya ingresó
        verificarEstatusEnGoogle();
    };

    // 2. CONSULTAR A GOOGLE SHEETS VIA JSONP (Inmune a CORS)
    function verificarEstatusEnGoogle() {
        const apellidoVisual = nombresVisualesFamilias[familiaUrlDecodificada];
        const src = `${URL_WEBHOOK_GOOGLE}?familia=${encodeURIComponent(apellidoVisual)}&callback=procesarEstatusAcceso`;
        
        const script = document.createElement("script");
        script.id = "jsonp-check-script";
        script.src = src;
        
        script.onerror = function() {
            // Plan de contingencia si no hay internet en el salón
            mostrarEstado("duplicate", "⚠️ Modo Offline Activo<br><span style='font-size:0.9rem; font-weight:normal;'>No se pudo conectar a Google Sheets, pero la familia sí pertenece al evento. Puedes darles el paso.</span>");
            document.getElementById("btn-checkin").style.display = "block";
            script.remove();
        };

        document.body.appendChild(script);
    }

    // 3. RECIBIR EL VEREDICTO DESDE GOOGLE SHEETS
    window.procesarEstatusAcceso = function(data) {
        // Eliminar el script temporal creado
        const scriptAntiguo = document.getElementById("jsonp-check-script");
        if (scriptAntiguo) scriptAntiguo.remove();

        // Caso A: No han confirmado asistencia en la web RSVP
        if (data.confirmado === false) {
            mostrarEstado("error", "❌ Alerta: No Confirmados<br><span style='font-size:0.9rem; font-weight:normal;'>Esta familia no registró su asistencia en la página web.</span>");
            document.getElementById("btn-checkin").style.display = "block"; 
            return;
        }

        // Caso B: Fraude / Invitación ya usada
        if (data.acceso && data.acceso.includes("ENTRÓ")) {
            mostrarEstado("error", `❌ ¡ACCESO DENEGADO!<br><span style='font-size:1rem; font-weight:normal;'>Esta invitación ya fue escaneada previamente.<br><strong>Estatus: ${data.acceso}</strong></span>`);
            return;
        }

        // Caso C: Todo en orden, listos para ingresar
        mostrarEstado("success", "✅ ¡INVITACIÓN VÁLIDA!<br><span style='font-size:1rem; font-weight:normal;'>Pases confirmados listos. Dale clic abajo para registrar su entrada.</span>");
        document.getElementById("btn-checkin").style.display = "block";
    };

    // 4. GUARDAR EL "CHECK-IN" EN EL EXCEL CUANDO EL STAFF DE CLIC AL BOTÓN
    function registrarEntrada() {
        const btn = document.getElementById("btn-checkin");
        btn.disabled = true;
        btn.innerText = "REGISTRANDO...";

        const apellidoVisual = nombresVisualesFamilias[familiaUrlDecodificada];
        
        const datosFormulario = new URLSearchParams();
        datosFormulario.append("familia", apellidoVisual);
        datosFormulario.append("tipo", "checkin"); 

        fetch(URL_WEBHOOK_GOOGLE, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: datosFormulario.toString()
        })
        .then(() => {
            mostrarEstado("success", "🎉 ¡BIENVENIDOS!<br><span style='font-size:1rem; font-weight:normal;'>Acceso concedido y registrado con éxito.</span>");
            btn.style.display = "none";
        })
        .catch(err => {
            console.error("Error al hacer check-in:", err);
            alert("Error de conexión al guardar el acceso. Inténtalo de nuevo.");
            btn.disabled = false;
            btn.innerText = "CONFIRMAR ENTRADA";
        });
    }

    function mostrarEstado(clase, texto) {
        const box = document.getElementById("status-box");
        box.className = "status-box " + clase;
        box.innerHTML = texto;
        box.style.display = "block";
    }
</script>
