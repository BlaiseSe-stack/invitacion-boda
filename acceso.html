<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso - Validación de QR</title>
    <link rel="stylesheet" type="text/css" href="css\styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;

            background-image: 
                linear-gradient(rgba(251, 246, 245, 0.4), rgba(251, 246, 245, 0.4)), 
                url('img/img4.png');
            background-size: cover;           /* Cubre toda la pantalla sin importar el monitor o tablet */
            background-position: center;      /* Centra la imagen de fondo */
            background-attachment: fixed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Control de Entrada</h1>
    
    <div id="status-box" class="status-box loading">
        🔄 Conectando con la base de datos...
    </div>

    <div id="info-panel" class="info-panel">
        <p><strong>Familia:</strong> <span id="info-familia">-</span></p>
    </div>

    <button id="btn-checkin" class="btn-action" onclick="registrarEntrada()">
        CONFIRMAR ENTRADA
    </button>
</div>

<script src="baseDatos/invitados.js"></script>


<script>
    // URL exacta de tu Google Apps Script (Debe ser la misma que usas en app.js)
    const URL_WEBHOOK_GOOGLE = "https://script.google.com/macros/s/AKfycbwxIu-RCkTtZW82GARIlSXdcj9-zt6fhzjLsUolTHg3iqW9RMbMK0nLniTRkHeJjlFP_A/exec";
    
    let familiaUrlDecodificada = "";

    // 1. LEER EL APELLIDO DESDE LA URL AL ABRIR LA PÁGINA
    window.onload = function() {
        const parametros = new URLSearchParams(window.location.search);
        // El QR debe apuntar a: acceso.html?familia=sanchez-espinoza
        const familiaUrl = parametros.get('familia'); 

        if (!familiaUrl) {
            mostrarEstado("error", "❌ QR Inválido<br><span style='font-size:0.9rem; font-weight:normal;'>Este código no contiene parámetros de familia.</span>");
            return;
        }

        // Convertimos "sanchez-espinoza" de vuelta a "sanchez espinoza" para buscar en la base de datos
        familiaUrlDecodificada = familiaUrl.replace(/-/g, " ").toLowerCase().trim();

        // Buscamos si existe en tu archivo invitados.js para validar que sea un invitado real
        if (!baseInvitadosEstricta[familiaUrlDecodificada]) {
            mostrarEstado("error", `❌ Familia No Encontrada<br><span style='font-size:0.9rem; font-weight:normal;'>"${familiaUrl}" no está en la lista de invitados.</span>`);
            return;
        }

        // Mostramos el nombre estético en el panel
        document.getElementById("info-familia").innerText = nombresVisualesFamilias[familiaUrlDecodificada];
        document.getElementById("info-panel").style.display = "block";

        // Consultamos en Google Sheets si ya ingresó
        verificarEstatusEnGoogle();
    };

    // 2. CONSULTAR A GOOGLE SHEETS (VERSIÓN ULTRA-SEGURA: ESPERA EL TIEMPO QUE SEA NECESARIO)
    function verificarEstatusEnGoogle() {
        const apellidoVisual = nombresVisualesFamilias[familiaUrlDecodificada];
        const src = `${URL_WEBHOOK_GOOGLE}?familia=${encodeURIComponent(apellidoVisual)}&callback=procesarEstatusAcceso`;
        
        const script = document.createElement("script");
        script.id = "jsonp-check-script";
        script.src = src;
        
        // Aumentamos el tiempo de espera a 25 segundos por si las antenas del salón están saturadas
        temporizadorRespuesta = setTimeout(function() {
            console.log("Tiempo de espera agotado.");
            // NOTA: Ya NO activamos el botón verde de forma automática. 
            // Mostramos un botón para reintentar la conexión de forma manual.
            mostrarEstado("duplicate", "⚠️ Conexión Lenta<br><span style='font-size:0.9rem; font-weight:normal;'>La lista está tardando en responder debido al internet de la zona.</span><br><br><button onclick='location.reload()' style='padding:8px; font-weight:bold; cursor:pointer;'>🔄 REINTENTAR ESCANEO</button>");
            
            const s = document.getElementById("jsonp-check-script");
            if (s) s.remove();
        }, 25000); // 25 segundos de tolerancia extrema

        script.onerror = function() {
            clearTimeout(temporizadorRespuesta);
            // Si la red se cae por completo, le avisa al staff y bloquea el paso hasta recuperar señal
            mostrarEstado("error", "❌ Sin Conexión a Internet<br><span style='font-size:0.9rem; font-weight:normal;'>El teléfono no tiene datos o señal celular. No se puede validar ni registrar la entrada en la lista.</span><br><br><button onclick='location.reload()' style='padding:8px; font-weight:bold; cursor:pointer;'>🔄 REINTENTAR CONEXIÓN</button>");
            script.remove();
        };

        document.body.appendChild(script);
    }

    // 3. RECIBIR EL VEREDICTO DESDE GOOGLE SHEETS
    window.procesarEstatusAcceso = function(data) {
        clearTimeout(temporizadorRespuesta); // Detenemos el reloj de error porque Google respondió

        const scriptAntiguo = document.getElementById("jsonp-check-script");
        if (scriptAntiguo) scriptAntiguo.remove();

        if (data.acceso === "ERROR") {
            mostrarEstado("error", `❌ Error Interno en la lista<br><span style='font-size:0.9rem; font-weight:normal;'>Detalle: ${data.msg}</span>`);
            return;
        }

        if (data.confirmado === false) {
            mostrarEstado("error", "❌ Alerta: No Confirmados<br><span style='font-size:0.9rem; font-weight:normal;'>Esta familia no se encuentra registrada en la lista de confirmaciones.</span>");
            // Aquí puedes decidir si dejas pasar a alguien no confirmado:
            // Si NO quieres que pasen si no confirmaron previamente en la web, dejas la siguiente línea comentada:
            // document.getElementById("btn-checkin").style.display = "block"; 
            return;
        }

        if (data.acceso && data.acceso.includes("ENTRÓ")) {
            mostrarEstado("error", `❌ ¡ACCESO DENEGADO!<br><span style='font-size:1rem; font-weight:normal;'>Esta invitación ya fue escaneada previamente.<br><strong>Estatus actual: ${data.acceso}</strong></span>`);
            return;
        }

        // ÉXITO REAL: Solo en este punto se revela el botón para dar el acceso
        mostrarEstado("success", "✅ ¡INVITACIÓN VÁLIDA!<br><span style='font-size:1rem; font-weight:normal;'>Pases confirmados listos en orden. Presiona abajo para registrar la entrada.</span>");
        document.getElementById("btn-checkin").style.display = "block";
    };

    // 4. GUARDAR EL "CHECK-IN" EN EL EXCEL CUANDO EL STAFF DE CLIC AL BOTÓN
    function registrarEntrada() {
        const btn = document.getElementById("btn-checkin");
        btn.disabled = true;
        btn.innerText = "REGISTRANDO...";

        const apellidoVisual = nombresVisualesFamilias[familiaUrlDecodificada];
        
        const datosFormulario = new URLSearchParams();
        datosFormulario.append("familia", apellidoVisual);
        datosFormulario.append("tipo", "checkin"); 

        fetch(URL_WEBHOOK_GOOGLE, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: datosFormulario.toString()
        })
        .then(() => {
            // 1. Ocultamos el botón de registro que ya se usó
            btn.style.display = "none";

            // 2. Modificamos el cuadro de estado a Éxito Total
            mostrarEstado("success", "🎉 ¡BIENVENIDOS!<br><span style='font-size:1rem; font-weight:normal;'>Acceso concedido y registrado con éxito.</span>");
            
            // 3. INYECCIÓN VISUAL: Creamos el bloque del álbum interactivo debajo de todo
            const contenedorAlbum = document.createElement("div");
            contenedorAlbum.style.marginTop = "30px";
            contenedorAlbum.style.padding = "20px";
            contenedorAlbum.style.borderRadius = "12px";
            contenedorAlbum.style.border = "2px dashed #b58d88"; // Tu color café sutil
            contenedorAlbum.style.backgroundColor = "#fbf6f5";   // Fondo claro elegante
            
            contenedorAlbum.innerHTML = `
                <p style="margin: 0 0 10px 0; font-size: 1.2rem; font-weight: bold; color: #b58d88;">📸 ¡Ayúdanos a recordar!</p>
                <p style="margin: 0 0 20px 0; font-size: 0.95rem; color: #5c4d4d; line-height: 1.4;">
                    Al ingresar al salón, den clic abajo para guardar el enlace de nuestro álbum de fotos digital.
                </p>
                <a href="https://photos.app.goo.gl/8yHHc7Fg4thW3smY7" target="_blank" 
                   style="display: block; padding: 12px; background-color: #b58d88; color: white; text-decoration: none; font-weight: bold; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                   👉 ENLACE AL ÁLBUM COMPARTIDO
                </a>
            `;
            
            // Colocamos el nuevo bloque al final del contenedor principal
            document.querySelector(".container").appendChild(contenedorAlbum);
        })
        .catch(err => {
            console.error("Error al hacer check-in:", err);
            alert("Error de conexión al guardar el acceso. Inténtalo de nuevo.");
            btn.disabled = false;
            btn.innerText = "CONFIRMAR ENTRADA";
        });
    }

    // Función estética para alternar las tarjetas de colores
    function mostrarEstado(clase, texto) {
        const box = document.getElementById("status-box");
        box.className = "status-box " + clase;
        box.innerHTML = texto;
        box.style.display = "block";
    }
</script>

</body>
</html>
