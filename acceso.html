<script>
    // URL exacta de tu Google Apps Script
    const URL_WEBHOOK_GOOGLE = "https://script.google.com/macros/s/AKfycbyPgEh9hPVwwKYakrZC5UVnGCsF6B7En5SKUsi1dmteCjTJB-pdh37H8ww8nr7kveJX/exec";
    
    let familiaUrlDecodificada = "";
    let temporizadorRespuesta;

    window.onload = function() {
        const parametros = new URLSearchParams(window.location.search);
        const familiaUrl = parametros.get('familia'); 

        if (!familiaUrl) {
            mostrarEstado("error", "❌ QR Inválido<br><span style='font-size:0.9rem; font-weight:normal;'>Este código no contiene parámetros de familia.</span>");
            return;
        }

        // Limpieza profunda de guiones
        familiaUrlDecodificada = familiaUrl.replace(/-/g, " ").toLowerCase().trim();

        if (!baseInvitadosEstricta[familiaUrlDecodificada]) {
            mostrarEstado("error", `❌ Familia No Encontrada<br><span style='font-size:0.9rem; font-weight:normal;'>"${familiaUrlDecodificada.toUpperCase()}" no está en invitados.js</span>`);
            return;
        }

        document.getElementById("info-familia").innerText = nombresVisualesFamilias[familiaUrlDecodificada];
        document.getElementById("info-panel").style.display = "block";

        // Lanzar consulta
        verificarEstatusEnGoogle();
    };

    function verificarEstatusEnGoogle() {
        const apellidoVisual = nombresVisualesFamilias[familiaUrlDecodificada];
        const src = `${URL_WEBHOOK_GOOGLE}?familia=${encodeURIComponent(apellidoVisual)}&callback=procesarEstatusAcceso`;
        
        const script = document.createElement("script");
        script.id = "jsonp-check-script";
        script.src = src;
        
        // ⚠️ DETECTOR DE ERRORES AUTOMÁTICO (TIMEOUT)
        // Si Google tarda más de 6 segundos, asumimos desconexión y liberamos el botón
        temporizadorRespuesta = setTimeout(function() {
            console.log("Tiempo de espera agotado. Activando modo de contingencia.");
            mostrarEstado("duplicate", "⚠️ Servidor Ocupado / Offline<br><span style='font-size:0.9rem; font-weight:normal;'>Google Sheets tardó demasiado en responder. Si confirmaron en físico, puedes darles el paso.</span>");
            document.getElementById("btn-checkin").style.display = "block";
            const s = document.getElementById("jsonp-check-script");
            if (s) s.remove();
        }, 6000);

        script.onerror = function() {
            clearTimeout(temporizadorRespuesta);
            mostrarEstado("duplicate", "⚠️ Error de Red de Google<br><span style='font-size:0.9rem; font-weight:normal;'>No se pudo establecer conexión. Acceso permitido mediante validación local.</span>");
            document.getElementById("btn-checkin").style.display = "block";
            script.remove();
        };

        document.body.appendChild(script);
    }

    // RESPUESTA GLOBAL JSONP
    window.procesarEstatusAcceso = function(data) {
        // Cancelamos el temporizador de error porque Google SÍ respondió
        clearTimeout(temporizadorRespuesta);

        const scriptAntiguo = document.getElementById("jsonp-check-script");
        if (scriptAntiguo) scriptAntiguo.remove();

        // Si el script de Google arroja un error interno nos avisará aquí
        if (data.acceso === "ERROR") {
            mostrarEstado("error", `❌ Error Interno en Sheets<br><span style='font-size:0.9rem; font-weight:normal;'>Detalle: ${data.msg}</span>`);
            return;
        }

        if (data.confirmado === false) {
            mostrarEstado("error", "❌ Alerta: No Confirmados<br><span style='font-size:0.9rem; font-weight:normal;'>Esta familia no se encuentra registrada en la pestaña de confirmaciones del Excel.</span>");
            document.getElementById("btn-checkin").style.display = "block"; 
            return;
        }

        if (data.acceso && data.acceso.includes("ENTRÓ")) {
            mostrarEstado("error", `❌ ¡ACCESO DENEGADO!<br><span style='font-size:1rem; font-weight:normal;'>Esta invitación ya fue escaneada previamente.<br><strong>Estatus actual: ${data.acceso}</strong></span>`);
            return;
        }

        // Éxito total
        mostrarEstado("success", "✅ ¡INVITACIÓN VÁLIDA!<br><span style='font-size:1rem; font-weight:normal;'>Pases listos en orden. Presiona el botón de abajo para registrar la entrada al salón.</span>");
        document.getElementById("btn-checkin").style.display = "block";
    };

    function registrarEntrada() {
        const btn = document.getElementById("btn-checkin");
        btn.disabled = true;
        btn.innerText = "REGISTRANDO...";

        const apellidoVisual = nombresVisualesFamilias[familiaUrlDecodificada];
        
        const datosFormulario = new URLSearchParams();
        datosFormulario.append("familia", apellidoVisual);
        datosFormulario.append("tipo", "checkin"); 

        fetch(URL_WEBHOOK_GOOGLE, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: datosFormulario.toString()
        })
        .then(() => {
            mostrarEstado("success", "🎉 ¡BIENVENIDOS!<br><span style='font-size:1rem; font-weight:normal;'>Acceso concedido y sellado en el Excel de forma exitosa.</span>");
            btn.style.display = "none";
        })
        .catch(err => {
            console.error("Error al hacer check-in:", err);
            alert("Error de conexión al guardar el acceso. Inténtalo de nuevo.");
            btn.disabled = false;
            btn.innerText = "CONFIRMAR ENTRADA";
        });
    }

    function mostrarEstado(clase, texto) {
        const box = document.getElementById("status-box");
        box.className = "status-box " + clase;
        box.innerHTML = texto;
        box.style.display = "block";
    }
</script>
